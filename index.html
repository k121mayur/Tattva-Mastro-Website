<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tattva Maestro | Something Numerically Divine Is Unfolding</title>
  <meta name="description" content="We are building Tattva Maestro — an illuminating portal designed to decode your universal vibrations, life path blueprints, and the hidden power of sacred numbers.">
  <meta name="theme-color" content="#050611">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">

  <!-- Google Fonts: Cinzel & Plus Jakarta Sans & Space Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient Background Canvas for Moving Numbers & Sacred Particles -->
  <canvas id="numbersCanvas"></canvas>

  <!-- Glowing Nebulae & Vignette Background Layers -->
  <div class="cosmos-glow-orb orb-1"></div>
  <div class="cosmos-glow-orb orb-2"></div>
  <div class="cosmos-glow-orb orb-3"></div>
  <div class="vignette-overlay"></div>

  <!-- Sacred Geometry Geometric Rings (Subtle Rotating Background) -->
  <div class="sacred-geometry-wrap" aria-hidden="true">
    <div class="geo-ring geo-ring-outer">
      <span class="ring-num n-1">1</span>
      <span class="ring-num n-2">2</span>
      <span class="ring-num n-3">3</span>
      <span class="ring-num n-4">4</span>
      <span class="ring-num n-5">5</span>
      <span class="ring-num n-6">6</span>
      <span class="ring-num n-7">7</span>
      <span class="ring-num n-8">8</span>
      <span class="ring-num n-9">9</span>
    </div>
    <div class="geo-ring geo-ring-middle">
      <div class="geo-polygon hexagram"></div>
    </div>
    <div class="geo-ring geo-ring-inner">
      <div class="geo-core-symbol">✦</div>
    </div>
  </div>

  <!-- Page Container (Absolute Centered) -->
  <div class="page-container">
    <main class="hero">
      <!-- Main Headline with Dynamic Numerology Keywords -->
      <h1 class="hero-headline">
        Something <span class="rotating-word-container">
          <span class="rotating-word active" data-word="Numerically Divine">Numerically Divine</span>
          <span class="rotating-word" data-word="Cosmically Destined">Cosmically Destined</span>
          <span class="rotating-word" data-word="Sacredly Calculated">Sacredly Calculated</span>
          <span class="rotating-word" data-word="Mystically Aligned">Mystically Aligned</span>
        </span> <br class="headline-br">is Unfolding.
      </h1>

      <!-- Subtitle clarifying site is being built & what it is -->
      <p class="hero-description">
        We are currently building <strong class="text-gold">Tattva Maestro</strong> — an illuminating portal designed to decode your universal vibrations, life path blueprints, and the hidden power of sacred numbers.
      </p>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
